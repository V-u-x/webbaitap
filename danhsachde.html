<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chọn Đề Thi - Học Sinh</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f0f2f5; padding: 14px; }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; background: #fff; padding: 14px 18px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .header h2 { font-size: 18px; color: #1c1e21; }
        .user-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .container { max-width: 1100px; margin: 0 auto; }
        .exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-bottom: 24px; }
        .exam-card { background: #fff; padding: 18px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; }
        .exam-card h3 { color: #1c1e21; margin-bottom: 8px; font-size: 17px; }
        .exam-card p { color: #606770; font-size: 14px; margin-bottom: 14px; line-height: 1.4; }
        .btn-start { background: #1877f2; color: #fff; border: none; padding: 11px; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; display: block; }
        .history-card { background: #fff; padding: 18px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .table-wrap { width: 100%; overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 480px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>
    <div class="header">
        <h2>SẢNH CHỌN ĐỀ THI</h2>
        <div class="user-bar">
            <span id="studentInfo" style="font-weight: bold; color: #1877f2; font-size: 14px;"></span>
            <button onclick="logout()" style="padding: 7px 14px; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer;">Đăng xuất</button>
        </div>
    </div>

    <div class="container">
        <div class="exam-grid" id="examGrid">Đang tải danh sách đề thi...</div>

        <div class="history-card">
            <h3 style="font-size: 17px;">Lịch sử làm bài của bạn</h3>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Tên đề thi</th>
                            <th>Số câu/ý đúng</th>
                            <th>Điểm số</th>
                            <th>Thời gian nộp</th>
                        </tr>
                    </thead>
                    <tbody id="myHistory">
                        <tr><td colspan="4">Đang tải lịch sử...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://sfxemmslukpximsfpwok.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aXGbcNmPBrtmNOJo4dxgFA_Op6JcZKz';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('studentInfo').textContent = `${currentUser.full_name} (${currentUser.username})`;
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        async function fetchExams() {
            const { data, error } = await supabaseClient.from('exams').select('id, title, duration, exam_type, answer_key').order('id', { ascending: true });
            const grid = document.getElementById('examGrid');

            if (error || !data.length) {
                grid.innerHTML = '<p>Hiện chưa có đề thi nào được mở.</p>';
                return;
            }

            grid.innerHTML = data.map(exam => {
                const dur = exam.duration || 60;
                let desc = '';
                if (exam.exam_type === 'tn2025') {
                    const parsed = JSON.parse(exam.answer_key);
                    desc = `Thời gian: <b>${dur} phút</b><br>Định dạng TN 2025: ${parsed.p1.answers.length} Trắc nghiệm, ${parsed.p2.answers.length} Đúng/Sai, ${parsed.p3.answers.length} Trả lời ngắn`;
                } else {
                    desc = `Thời gian: <b>${dur} phút</b><br>Số câu: ${exam.answer_key.length} câu trắc nghiệm`;
                }
                return `
                    <div class="exam-card">
                        <div>
                            <h3>${exam.title}</h3>
                            <p>${desc}</p>
                        </div>
                        <a href="hocsinh.html?id=${exam.id}" class="btn-start">Vào làm bài</a>
                    </div>`;
            }).join('');
        }

        async function fetchMyHistory() {
            const { data, error } = await supabaseClient
                .from('submissions')
                .select('*')
                .eq('username', currentUser.username)
                .order('id', { ascending: false });

            const tbody = document.getElementById('myHistory');
            if (error || !data.length) {
                tbody.innerHTML = '<tr><td colspan="4" style="color:#666;">Bạn chưa làm bài thi nào.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr>
                    <td><b>${item.exam_title}</b></td>
                    <td>${item.correct_count} câu/ý</td>
                    <td style="color:#d9534f; font-weight:bold;">${item.score}</td>
                    <td>${new Date(item.created_at).toLocaleString('vi-VN')}</td>
                </tr>
            `).join('');
        }

        fetchExams();
        fetchMyHistory();
    </script>
</body>
</html>
