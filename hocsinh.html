<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Thi Trực Tuyến</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f0f2f5; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #fff; padding: 10px 14px; border-bottom: 1px solid #ddd; }
        .header h2 { font-size: 15px; color: #1877f2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .timer { font-size: 15px; font-weight: bold; color: #d9534f; background: #fdf2f2; padding: 6px 9px; border-radius: 6px; }
        .btn-submit { background: #1877f2; color: #fff; border: none; padding: 7px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .btn-submit:disabled { background: #9cb4d8; cursor: not-allowed; }
        .btn-back { background: #e4e6eb; color: #050505; border: none; padding: 7px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; }

        .container { display: flex; flex: 1; overflow: hidden; padding: 8px; gap: 8px; }
        .pdf-panel { flex: 7; background: #525659; border-radius: 8px; border: 1px solid #ccc; display: flex; flex-direction: column; overflow: hidden; }
        .zoom-bar { display: flex; justify-content: center; align-items: center; gap: 12px; background: #323639; color: #fff; padding: 6px; font-size: 13px; }
        .zoom-bar button { background: #4b5054; color: #fff; border: none; padding: 4px 12px; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .pdf-viewer { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .pdf-viewer canvas { display: block; box-shadow: 0 2px 6px rgba(0,0,0,0.35); background: #fff; }

        .sidebar { flex: 3; background: #fff; border-radius: 8px; border: 1px solid #ddd; display: flex; flex-direction: column; padding: 10px; overflow: hidden; }
        .sidebar h3 { font-size: 15px; padding-bottom: 6px; border-bottom: 1px solid #eee; }
        .answer-sheet { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-right: 4px; margin-top: 4px; }
        .part-title { background: #e7f3ff; color: #1877f2; font-weight: bold; font-size: 13px; padding: 6px 8px; border-radius: 5px; margin: 8px 0 4px; }
        .question-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 4px; border-bottom: 1px dashed #eee; }
        .q-num { font-weight: bold; width: 56px; font-size: 14px; }
        .question-row label { display: flex; align-items: center; gap: 4px; padding: 5px 7px; font-size: 14px; cursor: pointer; border-radius: 6px; }
        .question-row input[type="radio"] { width: 18px; height: 18px; cursor: pointer; }

        .tf-card { border-bottom: 1px solid #eee; padding: 8px 4px; }
        .tf-card-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
        .tf-subrow { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; font-size: 14px; }
        .tf-subrow label { display: inline-flex; align-items: center; gap: 4px; margin-left: 12px; cursor: pointer; }
        .sa-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 4px; border-bottom: 1px dashed #eee; }
        .sa-row input { flex: 1; padding: 7px 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }

        @media (max-width: 768px) {
            .container { flex-direction: column; padding: 6px; gap: 6px; }
            .pdf-panel { flex: none; height: 54%; }
            .sidebar { flex: none; height: 46%; padding: 8px 10px; }
            #studentTag { display: none; }
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <header class="header">
        <h2 id="examTitle">Đang tải đề...</h2>
        <div class="actions">
            <span id="studentTag" style="font-weight: 500; color: #333; font-size: 14px;"></span>
            <span class="timer" id="timer">--:--</span>
            <button class="btn-submit" id="submitBtn" onclick="submitExam()">NỘP BÀI</button>
            <button class="btn-back" onclick="window.location.href='danhsachde.html'">Thoát</button>
        </div>
    </header>

    <div class="container">
        <main class="pdf-panel">
            <div class="zoom-bar">
                <button onclick="changeZoom(-0.2)">−</button>
                <span id="zoomLabel">100%</span>
                <button onclick="changeZoom(0.2)">+</button>
            </div>
            <div class="pdf-viewer" id="pdfContainer">
                <p style="color:#fff; margin-top:20px;">Đang tải nội dung đề thi...</p>
            </div>
        </main>
        <aside class="sidebar">
            <h3 id="sheetHeader">Phiếu trả lời</h3>
            <div class="answer-sheet" id="answer-sheet"></div>
        </aside>
    </div>

    <script>
        const SUPABASE_URL = 'https://sfxemmslukpximsfpwok.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aXGbcNmPBrtmNOJo4dxgFA_Op6JcZKz';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('studentTag').textContent = currentUser.full_name;
        }

        let currentExam = null;
        let parsedTn2025 = null;
        let isSubmitted = false;
        let cachedPdf = null;
        let zoomLevel = 1.0;
        let countdownInterval = null;

        function renderAnswerSheet(exam) {
            const sheet = document.getElementById('answer-sheet');
            const header = document.getElementById('sheetHeader');
            sheet.innerHTML = '';

            if (exam.exam_type === 'tn2025') {
                parsedTn2025 = JSON.parse(exam.answer_key);
                header.textContent = 'Phiếu trả lời (TN THPT 2025)';

                if (parsedTn2025.p1.answers.length > 0) {
                    sheet.innerHTML += `<div class="part-title">Phần I. Trắc nghiệm (${parsedTn2025.p1.answers.length} câu)</div>`;
                    for (let i = 1; i <= parsedTn2025.p1.answers.length; i++) {
                        sheet.innerHTML += `
                            <div class="question-row">
                                <span class="q-num">Câu ${i}:</span>
                                <label><input type="radio" name="p1_q${i}" value="A"> A</label>
                                <label><input type="radio" name="p1_q${i}" value="B"> B</label>
                                <label><input type="radio" name="p1_q${i}" value="C"> C</label>
                                <label><input type="radio" name="p1_q${i}" value="D"> D</label>
                            </div>`;
                    }
                }

                if (parsedTn2025.p2.answers.length > 0) {
                    sheet.innerHTML += `<div class="part-title">Phần II. Đúng / Sai (${parsedTn2025.p2.answers.length} câu)</div>`;
                    for (let i = 1; i <= parsedTn2025.p2.answers.length; i++) {
                        let subHtml = '';
                        ['a', 'b', 'c', 'd'].forEach(sub => {
                            subHtml += `
                                <div class="tf-subrow">
                                    <span>Ý ${sub})</span>
                                    <div>
                                        <label><input type="radio" name="p2_q${i}_${sub}" value="Đ"> Đúng</label>
                                        <label><input type="radio" name="p2_q${i}_${sub}" value="S"> Sai</label>
                                    </div>
                                </div>`;
                        });
                        sheet.innerHTML += `<div class="tf-card"><div class="tf-card-title">Câu ${i}:</div>${subHtml}</div>`;
                    }
                }

                if (parsedTn2025.p3.answers.length > 0) {
                    sheet.innerHTML += `<div class="part-title">Phần III. Trả lời ngắn (${parsedTn2025.p3.answers.length} câu)</div>`;
                    for (let i = 1; i <= parsedTn2025.p3.answers.length; i++) {
                        sheet.innerHTML += `
                            <div class="sa-row">
                                <span class="q-num">Câu ${i}:</span>
                                <input type="text" id="p3_q${i}" inputmode="decimal" placeholder="Nhập đáp số...">
                            </div>`;
                    }
                }
            } else {
                const totalQ = exam.answer_key.length;
                header.textContent = `Phiếu trả lời (${totalQ} câu)`;
                for (let i = 1; i <= totalQ; i++) {
                    sheet.innerHTML += `
                        <div class="question-row">
                            <span class="q-num">Câu ${i}:</span>
                            <label><input type="radio" name="q${i}" value="A"> A</label>
                            <label><input type="radio" name="q${i}" value="B"> B</label>
                            <label><input type="radio" name="q${i}" value="C"> C</label>
                            <label><input type="radio" name="q${i}" value="D"> D</label>
                        </div>`;
                }
            }
        }

        function startTimer(minutes) {
            let timeLeft = minutes * 60;
            const timerEl = document.getElementById('timer');
            const updateDisplay = () => {
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                timerEl.textContent = `${mins < 10 ? '0' + mins : mins}:${secs < 10 ? '0' + secs : secs}`;
            };
            updateDisplay();
            countdownInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    timerEl.textContent = '00:00';
                    submitExam();
                    return;
                }
                updateDisplay();
            }, 1000);
        }

        async function loadPdfFile(url) {
            const container = document.getElementById('pdfContainer');
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Không tải được dữ liệu PDF');
                const arrayBuffer = await response.arrayBuffer();
                cachedPdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                await renderPdfPages();
            } catch (err) {
                container.innerHTML = `<p style="color:#ffdddd; padding:16px; text-align:center;">Lỗi hiển thị đề thi: ${err.message}</p>`;
            }
        }

        async function renderPdfPages() {
            if (!cachedPdf) return;
            const container = document.getElementById('pdfContainer');
            container.innerHTML = '';

            const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
            const baseWidth = Math.max(container.clientWidth - 16, 280);
            const targetWidth = baseWidth * zoomLevel;

            for (let pageNum = 1; pageNum <= cachedPdf.numPages; pageNum++) {
                const page = await cachedPdf.getPage(pageNum);
                const unscaledViewport = page.getViewport({ scale: 1 });
                const scale = (targetWidth / unscaledViewport.width) * dpr;
                const viewport = page.getViewport({ scale });

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                canvas.style.width = `${targetWidth}px`;
                canvas.style.height = `${(viewport.height / dpr)}px`;

                container.appendChild(canvas);
                await page.render({ canvasContext: context, viewport }).promise;
            }
        }

        function changeZoom(delta) {
            zoomLevel = Math.min(Math.max(zoomLevel + delta, 0.8), 2.2);
            document.getElementById('zoomLabel').textContent = `${Math.round(zoomLevel * 100)}%`;
            renderPdfPages();
        }

        async function loadExamData() {
            const urlParams = new URLSearchParams(window.location.search);
            const examId = urlParams.get('id');
            if (!examId) {
                window.location.href = 'danhsachde.html';
                return;
            }

            const { data, error } = await supabaseClient.from('exams').select('*').eq('id', examId).single();
            if (error || !data) {
                alert('Không tìm thấy đề thi!');
                window.location.href = 'danhsachde.html';
                return;
            }

            currentExam = data;
            document.getElementById('examTitle').textContent = data.title;
            renderAnswerSheet(data);
            startTimer(data.duration || 60);
            loadPdfFile(data.pdf_url);
        }

        function normalizeShortAnswer(val) {
            return String(val || '').trim().replace(/,/g, '.').replace(/\s+/g, '').toLowerCase();
        }

        async function submitExam() {
            if (isSubmitted || !currentExam) return;
            isSubmitted = true;
            clearInterval(countdownInterval);

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Đang lưu...';

            let correctCount = 0;
            let totalScore = 0;
            let summaryMsg = '';

            if (currentExam.exam_type === 'tn2025' && parsedTn2025) {
                let p1Correct = 0;
                const p1Ans = parsedTn2025.p1.answers;
                for (let i = 1; i <= p1Ans.length; i++) {
                    const sel = document.querySelector(`input[name="p1_q${i}"]:checked`);
                    if (sel && sel.value === p1Ans[i - 1]) {
                        p1Correct++;
                    }
                }
                const p1Score = p1Correct * parsedTn2025.p1.points;

                let p2SubCorrectTotal = 0;
                let p2Score = 0;
                const p2Ans = parsedTn2025.p2.answers;
                const tfPointTable = [0, 0.1, 0.25, 0.5, 1.0];
                for (let i = 1; i <= p2Ans.length; i++) {
                    let subMatch = 0;
                    ['a', 'b', 'c', 'd'].forEach((sub, idx) => {
                        const sel = document.querySelector(`input[name="p2_q${i}_${sub}"]:checked`);
                        if (sel && sel.value === p2Ans[i - 1][idx]) {
                            subMatch++;
                        }
                    });
                    p2SubCorrectTotal += subMatch;
                    p2Score += tfPointTable[subMatch];
                }

                let p3Correct = 0;
                const p3Ans = parsedTn2025.p3.answers;
                for (let i = 1; i <= p3Ans.length; i++) {
                    const userRaw = document.getElementById(`p3_q${i}`).value;
                    const uNorm = normalizeShortAnswer(userRaw);
                    const kNorm = normalizeShortAnswer(p3Ans[i - 1]);
                    const isNumEqual = uNorm !== '' && !isNaN(Number(uNorm)) && !isNaN(Number(kNorm)) && Math.abs(Number(uNorm) - Number(kNorm)) < 1e-6;
                    if (uNorm !== '' && (uNorm === kNorm || isNumEqual)) {
                        p3Correct++;
                    }
                }
                const p3Score = p3Correct * parsedTn2025.p3.points;

                correctCount = p1Correct + p2SubCorrectTotal + p3Correct;
                totalScore = p1Score + p2Score + p3Score;
                summaryMsg = `Nộp bài thành công!\n- Phần I: ${p1Correct}/${p1Ans.length} câu (${p1Score.toFixed(2)}đ)\n- Phần II: ${p2SubCorrectTotal}/${p2Ans.length * 4} ý (${p2Score.toFixed(2)}đ)\n- Phần III: ${p3Correct}/${p3Ans.length} câu (${p3Score.toFixed(2)}đ)\n=> Tổng điểm: ${totalScore.toFixed(2)}`;
            } else {
                const key = currentExam.answer_key;
                const totalQ = key.length;
                for (let i = 1; i <= totalQ; i++) {
                    const selected = document.querySelector(`input[name="q${i}"]:checked`);
                    if (selected && selected.value === key[i - 1]) {
                        correctCount++;
                    }
                }
                totalScore = (correctCount / totalQ) * 10;
                summaryMsg = `Nộp bài thành công!\nSố câu đúng: ${correctCount}/${totalQ}\nĐiểm số: ${totalScore.toFixed(2)}/10`;
            }

            const finalScoreStr = totalScore.toFixed(2);
            await supabaseClient.from('submissions').insert([{
                username: currentUser.username,
                student_name: currentUser.full_name,
                exam_title: currentExam.title,
                correct_count: correctCount,
                score: finalScoreStr
            }]);

            alert(summaryMsg);
            window.location.href = 'danhsachde.html';
        }

        loadExamData();
    </script>
</body>
</html>
